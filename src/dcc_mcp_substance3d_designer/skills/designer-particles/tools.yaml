tools:
- name: bake_variation_tiles
  description: 'Sweep one seed or variation parameter across a bounded range and export
    a header-verified texture per step. Designer has no particle system; these tiles
    are decorrelated variations of one procedural source.'
  input_schema:
    type: object
    additionalProperties: false
    required:
    - output_dir
    - node_id
    - parameter
    - start
    - stop
    - count
    - outputs
    - expected_graph_uid
    properties:
      output_dir:
        type: string
        maxLength: 4096
        description: Fresh directory; refused when it already exists.
      node_id:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      parameter:
        type: string
        maxLength: 128
        pattern: ^\$?[A-Za-z][A-Za-z0-9_.-]*$
      value_type:
        type: string
        enum:
        - float
        - int
        default: float
      start:
        type: number
        minimum: -1000000
        maximum: 1000000
      stop:
        type: number
        minimum: -1000000
        maximum: 1000000
      count:
        type: integer
        minimum: 1
        maximum: 64
      outputs:
        type: array
        minItems: 1
        maxItems: 8
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - node_id
          - property
          properties:
            name:
              type: string
              maxLength: 128
              pattern: ^[A-Za-z][A-Za-z0-9_]{0,127}$
            node_id:
              type: string
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
            property:
              type: string
              maxLength: 128
              pattern: ^\$?[A-Za-z][A-Za-z0-9_.-]*$
      max_resolution:
        type: integer
        enum:
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        default: 2048
      expected_graph_uid:
        type: string
        maxLength: 256
  output_schema:
    type: object
    required:
    - success
    - message
    properties:
      success:
        type: boolean
      message:
        type: string
      context:
        type: object
  read_only: false
  destructive: false
  idempotent: false
  execution: async
  affinity: main
  timeout_hint_secs: 600
  source_file: scripts/bake_variation_tiles.py
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
  call_examples:
  - arguments:
      output_dir: D:/work/fx/spark_tiles
      node_id: '1581078951'
      parameter: seed
      value_type: int
      start: 1
      stop: 16
      count: 16
      outputs:
      - name: spark
        node_id: '1581078951'
        property: output
      expected_graph_uid: d3f1c2a4-0000-0000-0000-000000000000
      max_resolution: 1024
    note: Bake sixteen seed variations of a spark graph for a downstream particle system.
- name: compose_tile_atlas
  description: 'Pack one named map from a baked variation series into a grid sprite-sheet
    atlas. Requires PySide2 QtGui, which Designer ships.'
  input_schema:
    type: object
    additionalProperties: false
    required:
    - series_dir
    - output_path
    - file_name
    properties:
      series_dir:
        type: string
        maxLength: 4096
        description: Directory produced by bake_variation_tiles.
      output_path:
        type: string
        maxLength: 4096
        description: Fresh atlas image destination; refused when it already exists.
      file_name:
        type: string
        maxLength: 255
        description: 'Map file name present in every step, for example spark.png.'
      columns:
        type: integer
        minimum: 1
        description: Defaults to ceil(sqrt(step_count)) when omitted.
  output_schema:
    type: object
    required:
    - success
    - message
    properties:
      success:
        type: boolean
      message:
        type: string
      context:
        type: object
  read_only: false
  destructive: false
  idempotent: false
  execution: sync
  affinity: main
  timeout_hint_secs: 300
  source_file: scripts/compose_tile_atlas.py
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
  call_examples:
  - arguments:
      series_dir: D:/work/fx/spark_tiles
      output_path: D:/work/fx/spark_atlas.png
      file_name: spark.png
      columns: 4
    note: Pack sixteen tiles into a 4x4 sprite sheet.
